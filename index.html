<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NJ store · Inventario</title>
<meta name="theme-color" content="#0b0b0b"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><meta name="mobile-web-app-capable" content="yes">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600&family=Barlow+Condensed:ital,wght@0,700;1,800&display=swap" rel="stylesheet">

<style>
[hidden]{display:none!important}
:root{--bg:#f4f4f4;--card:#fff;--ink:#0b0b0b;--mut:#666;--line:#cfcfcf;--acc:#111;--onacc:#fff;--ok:#111;--bad:#c62828;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0b0b;--card:#161616;--ink:#f5f5f5;--mut:#a0a0a0;--line:#333;--acc:#fff;--onacc:#111;--ok:#fff;--bad:#ff6b6b}}
:root[data-theme="dark"]{--bg:#0b0b0b;--card:#161616;--ink:#f5f5f5;--mut:#a0a0a0;--line:#333;--acc:#fff;--onacc:#111;--ok:#fff;--bad:#ff6b6b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:'Barlow',system-ui,sans-serif}
main{max-width:960px;margin:0 auto;padding:16px}
.top{display:flex;align-items:center;gap:14px;background:#0b0b0b;color:#fff;margin:-16px -16px 16px;padding:20px 18px;border-radius:0 0 20px 20px}.logo img{height:68px;width:68px;display:block;border-radius:50%}.brand{font:italic 800 2.1rem/1 'Barlow Condensed',sans-serif;letter-spacing:.01em}.sub{opacity:.85;font-size:.95rem;margin-top:2px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.stat,.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.stat{border-left:4px solid var(--acc)}.stat b{display:block;font:700 1.9rem/1.1 'Barlow Condensed',sans-serif}.stat span{color:var(--mut);font-size:.85rem}
.panel{margin-bottom:14px}
form{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
label{font-size:.8rem;color:var(--mut);display:flex;flex-direction:column;gap:3px}
input,select{font:inherit;padding:9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);width:100%}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
button{font:inherit;font-weight:600;border:0;border-radius:8px;padding:9px 14px;background:var(--acc);color:var(--onacc);cursor:pointer}
button.sec{background:transparent;color:var(--ink);border:1px solid var(--line)}
button.ok{background:var(--ok)}button.bad{background:transparent;color:var(--bad);border:1px solid var(--line)}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.bar input{flex:1;min-width:160px}
.tabs button{border-radius:8px}.tabs button:not(.on){background:transparent;color:var(--mut);border:1px solid var(--line)}
.tbl{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);white-space:nowrap}th{color:var(--mut);font-weight:600;font-size:.8rem}
.act{display:flex;gap:6px}.act button{padding:6px 10px;font-size:.85rem}
.empty{color:var(--mut);padding:20px;text-align:center}.low{color:var(--bad);font-weight:600}
.th{width:46px;height:46px;object-fit:cover;border-radius:8px;display:block;cursor:pointer;background:var(--bg)}.ph{display:grid;place-items:center;cursor:default;font-size:1.1rem}small{color:var(--mut)}
#lg{position:fixed;inset:0;z-index:20;background:#0b0b0b;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center}
#lg img{width:120px;height:120px;border-radius:50%}#lg h2{font:italic 800 2rem/1 'Barlow Condensed',sans-serif;margin:0}
#lg form{display:flex;flex-direction:column;gap:10px;width:100%;max-width:300px}#lg input{background:#161616;border:1px solid #333;color:#fff;text-align:center;font-size:1.05rem}
#lg button{background:#fff;color:#111}#lgm{min-height:1.3em;font-size:.9rem;color:#ff8a8a}#lg small{color:#a0a0a0}
.top .sec{margin-left:auto;border-color:#444;color:#fff;font-size:.85rem;padding:6px 10px}
</style></head><body><div id="lg"><img id="lgimg" alt="NJ store"><h2>NJ store</h2><div id="lgl"><small>Conectando…</small></div>

  if(m)await put('items',{...m,cant:m.cant+o.cant,...(o.foto?{foto:o.foto}:{})});else await put('items',{id:uid(),...o})}
 f.reset();$('cat').value=c;setForm();fotoData=null;$('fst').textContent='';$('cant').value=1;tab=1;render();$('modelo').focus();};
async function sell(id){const i=D.items.find(x=>x.id==id);if(!i)return;const {cant,foto,...r}=i;
 await put('sales',{...r,id:uid(),fecha:new Date().toLocaleDateString('es-CL')});
 if(cant<=1)await rm('items',id);else await put('items',{...i,cant:cant-1});}
async function undo(id){const s=D.sales.find(x=>x.id==id);if(!s)return;const {fecha,...r}=s;
 const m=D.items.find(i=>K(i)==K(r));
 if(m)await put('items',{...m,cant:m.cant+1});else await put('items',{...r,id:uid(),cant:1});
 await rm('sales',id);}
function edit(id){const i=D.items.find(x=>x.id==id);editId=id;$('cat').value=i.cat||'zapatillas';setForm();
 ['modelo','talla','cm','tipo','color','costo','venta','cant'].forEach(k=>$(k).value=i[k]??'');$('genero').value=i.genero||'Hombre';
 $('btnAdd').textContent='Guardar cambios';window.scrollTo({top:0,behavior:'smooth'});$('modelo').focus();}
let delArm=null;
function del(id,b){if(delArm!==id){delArm=id;b.textContent='¿Seguro?';setTimeout(()=>{if(delArm===id){delArm=null;render()}},3000);return}delArm=null;rm('items',id)}
let fotoData=null;
$('foto').onchange=e=>{const f=e.target.files[0];if(!f){fotoData=null;$('fst').textContent='';return}
 const img=new Image(),u=URL.createObjectURL(f);
 img.onload=()=>{const r=Math.min(1,480/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*r);c.height=Math.round(img.height*r);c.getContext('2d').drawImage(img,0,0,c.width,c.height);fotoData=c.toDataURL('image/jpeg',.6);URL.revokeObjectURL(u);$('fst').textContent='Foto lista'};
 img.onerror=()=>{fotoData=null;$('fst').textContent='No pude leer la foto'};img.src=u;};
function zoom(src){const d=document.createElement('div');d.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;z-index:9;padding:16px';d.innerHTML='<img src="'+src+'" style="max-width:100%;max-height:100%;border-radius:12px" alt="">';d.onclick=()=>d.remove();document.body.appendChild(d)}
function dup(id){const i=D.items.find(x=>x.id==id);if(!i)return;const c=i.cat||'zapatillas';editId=null;$('btnAdd').textContent='Agregar';
 $('cat').value=c;setForm();$('modelo').value=i.modelo;$('talla').value='';$('cm').value='';$('tipo').value=i.tipo||'';$('genero').value=i.genero||'Hombre';
 $('color').value=c=='accesorios'?'':i.color||'';$('costo').value=i.costo;$('venta').value=i.venta;$('cant').value=1;
 fotoData=i.foto||null;$('foto').value='';$('fst').textContent=i.foto?'Foto copiada':'';
 window.scrollTo({top:0,behavior:'smooth'});(c=='accesorios'?$('color'):$('talla')).focus();}
$('exp').onclick=async()=>{if(typeof XLSX=='undefined'){alert('Para generar el Excel necesitas conexión a internet. Conéctate e inténtalo de nuevo.');return}
 const d=x=>({'Categoría':CN[x.cat||'zapatillas'],'Nombre':x.modelo,'Tipo de prenda':x.tipo||'','Género':x.genero||'','Talla':x.talla||'','Centímetros':x.cm||'','Color':x.color||''});
 const st=D.items.map(i=>({...d(i),'Cantidad':i.cant,'Precio costo':i.costo,'Precio venta':i.venta,'Ganancia por unidad':i.venta-i.costo,'Total costo':i.cant*i.costo,'Total a precio de venta':i.cant*i.venta}));
 const vt=D.sales.map(x=>({'Fecha':x.fecha,...d(x),'Precio costo':x.costo,'Precio venta':x.venta,'Ganancia':x.venta-x.costo}));
 const rs=[['zapatillas','Zapatillas'],['ropa','Ropa'],['accesorios','Accesorios'],['todo','Total']].map(([k,n])=>{const f=x=>k=='todo'||(x.cat||'zapatillas')==k,it=D.items.filter(f),sl=D.sales.filter(f);
  const c=it.reduce((a,i)=>a+i.cant*i.costo,0),cv=sl.reduce((a,x)=>a+x.costo,0),ig=sl.reduce((a,x)=>a+x.venta,0);
  return {'Categoría':n,'Pares/unidades en stock':it.reduce((a,i)=>a+i.cant,0),'Vendidas':sl.length,'Invertido en stock':c,'Stock a precio de venta':it.reduce((a,i)=>a+i.cant*i.venta,0),'Total invertido':c+cv,'Total ganado en ventas':ig,'Ganancia neta':ig-cv}});
 const wb=XLSX.utils.book_new();
 XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rs),'Resumen');
 XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(st),'Stock');
 XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(vt),'Vendidas');
 const buf=XLSX.write(wb,{bookType:'xlsx',type:'array'});
 descargar('NJ-store-inventario-'+new Date().toISOString().slice(0,10)+'.xlsx',new Blob([buf],{type:'application/octet-stream'}))};
function descargar(n,b){const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)}
$('bk').onclick=()=>descargar('NJ-store-respaldo-'+new Date().toISOString().slice(0,10)+'.json',new Blob([JSON.stringify(D)],{type:'application/json'}));
$('rs').onclick=()=>$('rsf').click();
$('rsf').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;let j;try{j=JSON.parse(await f.text());if(!Array.isArray(j.items)||!Array.isArray(j.sales))throw 0}catch(err){alert('El archivo no es un respaldo válido.');return}
 if(!confirm('Se agregarán '+j.items.length+' productos y '+j.sales.length+' ventas del respaldo a la base de datos. Si ya existen, se actualizan. ¿Continuar?'))return;
 setSt('Subiendo respaldo…');try{await subir('items',j.items);await subir('sales',j.sales);await loadAll();alert('Respaldo cargado.')}catch(err){warn(err);setSt('Error al subir')}};
async function subir(k,arr){const rows=arr.filter(x=>x&&x.id).map(({id,...data})=>({id:String(id),data,updated_at:new Date().toISOString()}));
 for(let i=0;i<rows.length;i+=15){const {error}=await sb.from(k).upsert(rows.slice(i,i+15));if(error)throw error}}
$('t1').onclick=()=>{tab=1;render()};$('t2').onclick=()=>{tab=2;render()};$('q').oninput=render;
$('imp').onclick=()=>$('file').click();
$('file').onchange=async e=>{const f=e.target.files[0];if(!f)return;
 try{if(typeof XLSX=='undefined'){alert('Para importar un Excel necesitas conexión a internet. Conéctate e inténtalo de nuevo.');e.target.value='';return}const wb=XLSX.read(await f.arrayBuffer());const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames.includes('Stock')?'Stock':wb.SheetNames[0]]);
  const g=(r,names)=>{for(const k in r){const n=k.toLowerCase();if(names.some(x=>n.includes(x)))return r[k]}return ''};
  let n=0;for(const r of rows){const modelo=String(g(r,['modelo','nombre','producto'])).trim();if(!modelo)continue;
   const ct=String(g(r,['categor'])).toLowerCase(),cat=ct.includes('ropa')?'ropa':ct.includes('accesor')?'accesorios':'zapatillas';await put('items',{id:uid(),cat,modelo,talla:String(g(r,['numer','talla','size'])),cm:+g(r,['cent','cm'])||0,tipo:String(g(r,['tipo'])),genero:String(g(r,['gener'])),color:String(g(r,['color'])),costo:+g(r,['costo'])||0,venta:+g(r,['venta'])||0,cant:+g(r,['cant','stock'])||1});n++}
  alert(n+' zapatillas importadas.');
 }catch(err){alert('No pude leer el archivo. Revisa que sea un Excel (.xlsx) con encabezados en la primera fila.')}
 e.target.value='';};
$('lgimg').src=document.querySelector('.logo img').src;
function showLogin(){$('lg').hidden=false;$('lgl').hidden=true;$('lgf').hidden=false;$('salir').hidden=true;setTimeout(()=>$('lgp').focus(),50)}
async function start(){if(started)return;started=true;$('lg').hidden=true;$('salir').hidden=false;setSt('Conectando…');await loadAll();
 sb.channel('nj-store').on('postgres_changes',{event:'*',schema:'public',table:'items'},p=>apply('items',p)).on('postgres_changes',{event:'*',schema:'public',table:'sales'},p=>apply('sales',p)).subscribe();
 migrarLocal()}
function apply(k,p){if(p.eventType=='DELETE'){const id=p.old&&p.old.id;D[k]=D[k].filter(x=>x.id!=id)}else if(p.new){const o=rowToObj(p.new),a=D[k],j=a.findIndex(x=>x.id==o.id);if(j<0)a.push(o);else a[j]=o}render()}
async function migrarLocal(){if(!LOCAL||!(LOCAL.items&&LOCAL.items.length||LOCAL.sales&&LOCAL.sales.length))return;
 if(!confirm('Hay '+(LOCAL.items||[]).length+' productos y '+(LOCAL.sales||[]).length+' ventas guardados solo en este teléfono. ¿Subirlos a la base de datos para que se vean en todos los teléfonos?'))return;
 try{await subir('items',LOCAL.items||[]);await subir('sales',LOCAL.sales||[]);localStorage.removeItem(KEY);LOCAL=null;await loadAll();alert('Listo: los datos de este teléfono ya están en la base de datos.')}catch(e){warn(e)}}
$('lgf').onsubmit=async e=>{e.preventDefault();$('lgm').textContent='';$('lgb').disabled=true;
 const {error}=await sb.auth.signInWithPassword({email:SB_MAIL,password:$('lgp').value});$('lgb').disabled=false;
 if(error){$('lgm').textContent=/invalid|credentials/i.test(error.message)?'Contraseña incorrecta.':'No se pudo ingresar. Revisa tu conexión.';$('lgp').select()}else $('lgp').value=''};

(async()=>{
 if(typeof supabase=='undefined'){$('lgl').innerHTML='<small>No se pudo cargar la app. Revisa tu conexión a internet y vuelve a abrirla.</small>';return}
 sb=supabase.createClient(SB_URL,SB_KEY);
